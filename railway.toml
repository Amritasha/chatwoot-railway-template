[build]
builder = "dockerfile"

[deploy]
# Chatwoot runs `rails db:chatwoot_prepare` before it binds a port. On a cold
# Postgres that regularly runs past the old 300s window, and the deploy was
# being killed mid-migration — which leaves a half-migrated database that
# fails again on the retry.
healthcheckPath = "/api"
healthcheckTimeout = 900
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[variables]
RAILS_ENV = "production"
NODE_ENV = "production"
INSTALLATION_ENV = "docker"
RAILS_LOG_TO_STDOUT = "true"
RAILS_SERVE_STATIC_FILES = "true"
NUMBER_OF_PROXIES = "1"
